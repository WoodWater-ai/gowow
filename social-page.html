<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gowow - Social Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        background: #111827;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      }
      .phone {
        width: 393px;
        height: 852px;
        margin: 14px auto;
        border-radius: 48px;
        overflow: hidden;
        background: #f3f4f6;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }
      .stack-back {
        position: absolute;
        inset-inline: 12px;
        top: 8px;
        bottom: 0;
        border-radius: 28px;
        background: linear-gradient(to bottom, #e5e7eb, #f3f4f6);
        transform: scale(0.98);
        opacity: 0.9;
      }
      .stack-base {
        position: absolute;
        inset-inline: 24px;
        top: 14px;
        bottom: 0;
        border-radius: 28px;
        background: linear-gradient(to bottom, #d1d5db, #f3f4f6);
        transform: scale(0.95);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="h-full flex flex-col bg-[#F3F4F6] text-gray-900">
        <div class="bg-white px-5 pt-12 pb-3 shadow-sm">
          <h1 class="text-2xl font-black">社交</h1>
          <p class="text-sm text-gray-500 mt-1">算法优先帮你匹配高契合用户，再继续私聊和进群</p>
        </div>

        <div class="flex-1 overflow-y-auto px-4 py-3 pb-24 space-y-3">
          <section class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h2 class="text-base font-black">推荐用户</h2>
                <p class="text-[11px] text-gray-500 mt-1">基于共同地点、玩法和旅行风格推荐</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-[11px] font-bold text-gray-400">1/3</span>
                <span class="text-orange-500 text-[11px] font-bold">查看更多</span>
              </div>
            </div>

            <div class="relative h-[208px] mt-2 overflow-hidden">
              <div class="stack-base"></div>
              <div class="stack-back p-4 bg-white border border-gray-100 shadow-lg">
                <div class="flex items-center gap-3">
                  <img class="w-14 h-14 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=150&auto=format&fit=crop" alt="next" />
                  <div>
                    <div class="text-base font-black">阿Ken在路上</div>
                    <div class="text-[10px] text-gray-400 mt-1">下一位高契合推荐</div>
                  </div>
                </div>
              </div>

              <div class="absolute inset-0 rounded-[28px] overflow-hidden bg-white shadow-xl border border-gray-100 p-4">
                <div class="flex items-center gap-3 min-w-0">
                  <img class="w-16 h-16 rounded-[20px] object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=150&auto=format&fit=crop" alt="avatar" />
                  <div class="min-w-0">
                    <div class="text-xl font-black truncate">曼谷不睡觉</div>
                    <div class="text-[11px] text-gray-500 mt-1">10分钟前</div>
                  </div>
                </div>

                <div class="flex flex-wrap gap-1.5 mt-3">
                  <span class="px-2 py-1 rounded-full bg-gray-100 text-gray-700 text-[10px] font-bold">夜市控</span>
                  <span class="px-2 py-1 rounded-full bg-gray-100 text-gray-700 text-[10px] font-bold">轻社交</span>
                  <span class="px-2 py-1 rounded-full bg-gray-100 text-gray-700 text-[10px] font-bold">拍照党</span>
                </div>

                <div class="mt-3 flex flex-wrap gap-1.5">
                  <span class="px-2.5 py-1.5 rounded-full bg-orange-50 text-orange-700 text-[10px] font-bold border border-orange-100">同样收藏了辉煌夜市</span>
                </div>

                <div class="grid grid-cols-3 gap-2 mt-3">
                  <button class="py-2.5 rounded-2xl bg-gray-100 text-gray-600 text-xs font-black">跳过</button>
                  <button class="py-2.5 rounded-2xl bg-gray-900 text-white text-xs font-black">去私聊</button>
                  <button class="py-2.5 rounded-2xl bg-orange-500 text-white text-xs font-black">喜欢</button>
                </div>
              </div>
            </div>
          </section>

          <section class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-black">最近私聊</h2>
              <span class="text-orange-500 text-[11px] font-bold">全部消息</span>
            </div>
            <div class="space-y-1.5">
              <div class="flex items-center gap-3 rounded-2xl px-2 py-2 bg-white">
                <img class="w-12 h-12 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=150&auto=format&fit=crop" alt="chat" />
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-3">
                    <div class="text-sm font-black truncate">曼谷不睡觉</div>
                    <div class="text-[10px] text-gray-400">刚刚</div>
                  </div>
                  <div class="text-xs text-gray-500 truncate mt-1">我已经把夜市集合点发群里了</div>
                </div>
                <span class="min-w-5 h-5 px-1.5 rounded-full bg-orange-500 text-white text-[10px] font-black flex items-center justify-center">2</span>
              </div>

              <div class="flex items-center gap-3 rounded-2xl px-2 py-1.5 bg-white">
                <img class="w-12 h-12 rounded-2xl object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=150&auto=format&fit=crop" alt="chat" />
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-3">
                    <div class="text-sm font-black truncate">阿Ken在路上</div>
                    <div class="text-[10px] text-gray-400">12:18</div>
                  </div>
                  <div class="text-xs text-gray-500 truncate mt-1">你更想先吃还是先拍？</div>
                </div>
              </div>

            </div>
          </section>

          <section class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-black">我加入的群组</h2>
              <span class="text-orange-500 text-[11px] font-bold">查看更多</span>
            </div>
            <div class="space-y-3">
              <div class="rounded-2xl bg-gray-50 border border-gray-100 p-4">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <div class="text-sm font-black">曼谷夜市暴走局</div>
                    <div class="text-xs text-gray-500 mt-1">本周五 20:00 · 夜市觅食</div>
                  </div>
                  <span class="min-w-6 h-6 px-2 rounded-full bg-orange-500 text-white text-[10px] font-black flex items-center justify-center">8</span>
                </div>
                <div class="flex items-center justify-between mt-3">
                  <div class="text-[11px] text-gray-400">成员 128/500</div>
                  <div class="text-[11px] font-bold text-orange-500">进入群组</div>
                </div>
              </div>
            </div>
          </section>
        </div>

        <div class="h-[76px] bg-white border-t border-gray-100 flex justify-around items-center px-6 pb-4">
          <div class="flex flex-col items-center text-gray-400">
            <div class="w-6 h-6 mb-1 rounded-full border-2 border-current"></div>
            <span class="text-[10px] font-medium">探索</span>
          </div>
          <div class="flex flex-col items-center text-orange-500">
            <div class="w-6 h-6 mb-1 rounded-full border-2 border-current"></div>
            <span class="text-[10px] font-bold">社交</span>
          </div>
          <div class="flex flex-col items-center text-gray-400">
            <div class="w-6 h-6 mb-1 rounded-full border-2 border-current"></div>
            <span class="text-[10px] font-medium">规划</span>
          </div>
          <div class="flex flex-col items-center text-gray-400">
            <div class="w-6 h-6 mb-1 rounded-full border-2 border-current"></div>
            <span class="text-[10px] font-medium">我的</span>
          </div>
        </div>
      </div>
    </div>
  </body>
  </html>
