            </div>
          </div>
          <div className="flex-1 overflow-y-auto pb-24 scrollbar-hide">

                <div>
                  <p className="text-xl font-black">{mainGroupData.name}</p>
                  <p className="text-xs text-white/70 mt-2">{mainGroupData.city} · {mainGroupData.place}</p>
                </div>

              </div>
              <div className="flex flex-wrap gap-2 mt-4">
                <span className="px-2.5 py-1 rounded-full bg-white/10 text-[10px] font-bold">{mainGroupData.schedule}</span>
                <span className="px-2.5 py-1 rounded-full bg-white/10 text-[10px] font-bold">{mainGroupData.mode}</span>
              </div>
              <div className="mt-4 bg-white/10 rounded-2xl p-3 border border-white/10">

              </div>
              <div className="mt-3 bg-white/10 rounded-2xl p-3 border border-white/10">
                <p className="text-[10px] text-white/60 font-bold uppercase">群置顶</p>
                <p className="text-sm font-medium leading-relaxed mt-2">{mainGroupData.pinned}</p>
              </div>
            </div>
            <div className="bg-white mx-4 mt-4 rounded-3xl p-4 border border-gray-100 shadow-sm">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-sm font-black text-gray-900">成员预览</h2>
                <button onClick={() => navigate('interest')} className="text-orange-500 text-[11px] font-bold">查看更多</button>
              </div>
              <div className="flex gap-3 overflow-x-auto scrollbar-hide pb-1">
                {interestUsers.map(user => (
                  <button key={user.id} onClick={() => navigate('profile')} className="min-w-[78px] flex flex-col items-center text-center">
                    <img src={user.avatar} className="w-14 h-14 rounded-2xl object-cover" alt={user.name} />
                    <span className="text-[10px] font-bold text-gray-700 mt-2 line-clamp-1">{user.name}</span>
                  </button>
                ))}
              </div>
            </div>
            <div className="bg-white mx-4 my-4 rounded-3xl p-4 border border-gray-100 shadow-sm">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-sm font-black text-gray-900">群留言</h2>
                <button onClick={() => navigate('chat')} className="text-orange-500 text-[11px] font-bold">发起私聊</button>
              </div>
              <div className="space-y-3">
                {groupMessages.map(msg => (
                  <div key={msg.id} className={`flex ${msg.mine ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[82%] rounded-2xl px-3 py-2.5 ${msg.mine ? 'bg-orange-500 text-white rounded-br-md' : 'bg-gray-100 text-gray-800 rounded-bl-md'}`}>

            <button className="px-5 rounded-full bg-orange-500 text-white text-sm font-bold">发送</button>
          </div>

      // 7. Chat 私聊页
      const ScreenChat = ({ navigate, goBack }) => (
        <div className="relative w-full h-full bg-[#F8FAFC] flex flex-col font-sans overflow-hidden">
          <div className="bg-white px-4 pt-12 pb-4 sticky top-0 z-20 shadow-sm">
            <div className="flex items-center gap-3">
              <button onClick={goBack} className="p-2 -ml-2 text-gray-600 hover:bg-gray-100 rounded-full"><ChevronLeft className="w-6 h-6" /></button>
              <img src={interestUsers[0].avatar} className="w-10 h-10 rounded-2xl object-cover" alt="avatar" />
              <div className="flex-1">
                <p className="text-sm font-black text-gray-900">{interestUsers[0].name}</p>
                <p className="text-[10px] text-gray-400">你们都在「{mainGroupData.name}」群里</p>
              </div>
            </div>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3 pb-24 scrollbar-hide">
            {chatMessages.map(msg => (
              <div key={msg.id} className={`flex ${msg.mine ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[80%] rounded-3xl px-4 py-3 shadow-sm ${msg.mine ? 'bg-orange-500 text-white rounded-br-md' : 'bg-white text-gray-800 rounded-bl-md border border-gray-100'}`}>
                  <p className="text-sm leading-relaxed">{msg.text}</p>
                </div>
              </div>
            ))}
          </div>
          <div className="absolute bottom-0 w-full bg-white border-t border-gray-100 p-4 pb-8 z-30 flex gap-3">
            <div className="flex-1 bg-gray-50 rounded-full px-4 py-3 text-sm text-gray-400">继续聊路线和集合时间...</div>
            <button className="px-5 rounded-full bg-gray-900 text-white text-sm font-bold">发送</button>
          </div>
        </div>
      );

      // 8. Profile 旅行社交主页
      const ScreenProfileGamification = ({ navigate, goBack }) => {
        return (
          <div className="relative w-full h-full bg-gray-50 flex flex-col font-sans overflow-hidden">
            <div className="bg-gray-900 px-5 pt-12 pb-6 relative overflow-hidden">
              <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop" className="absolute inset-0 w-full h-full object-cover opacity-30" alt="cover" />
              <div className="absolute inset-0 bg-gradient-to-b from-black/50 to-black/80"></div>
              <div className="relative z-10">
                <div className="flex justify-between items-center mb-6"><button onClick={goBack} className="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white"><ChevronLeft className="w-5 h-5" /></button><Settings className="w-5 h-5 text-white/70" /></div>
                <div className="flex items-center gap-4">
                  <img src={userProfileData.avatar} className="w-20 h-20 rounded-[28px] object-cover border border-white/20" alt="avatar" />
                  <div className="flex-1">
                    <h2 className="text-xl font-black text-white">{userProfileData.name}</h2>
                    <p className="text-sm text-white/70 mt-1">喜欢城市夜游和本地小吃，出门前一定做攻略，但现场也愿意临时改计划。</p>
                  </div>
                </div>
                <div className="flex flex-wrap gap-2 mt-5">
                  {profileSections.tags.map(tag => <span key={tag} className="px-3 py-1.5 rounded-full bg-white/10 text-white text-[11px] font-bold">{tag}</span>)}
                </div>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto bg-gray-50 pb-24 scrollbar-hide px-5 py-4 space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <button onClick={() => navigate('chat')} className="rounded-2xl py-3.5 bg-gray-900 text-white text-sm font-bold">发私聊</button>
                <button onClick={() => navigate('group')} className="rounded-2xl py-3.5 bg-orange-500 text-white text-sm font-bold">查看群组</button>
              </div>
              <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                <h3 className="font-black text-gray-900 mb-3">最近去过</h3>
                <div className="flex flex-wrap gap-2">{profileSections.visited.map(item => <span key={item} className="px-3 py-2 rounded-2xl bg-gray-100 text-gray-700 text-xs font-bold">{item}</span>)}</div>
              </div>
              <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                <h3 className="font-black text-gray-900 mb-3">接下来想去</h3>
                <div className="flex flex-wrap gap-2">{profileSections.wishes.map(item => <span key={item} className="px-3 py-2 rounded-2xl bg-orange-50 text-orange-600 text-xs font-bold">{item}</span>)}</div>
              </div>
              <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                <div className="flex items-center justify-between mb-3"><h3 className="font-black text-gray-900">发布内容</h3><button onClick={() => navigate('review')} className="text-orange-500 text-[11px] font-bold">去发布</button></div>
                <div className="grid grid-cols-2 gap-3">
                  {profileSections.posts.map(post => (
                    <div key={post.id} className="rounded-2xl overflow-hidden bg-gray-50 border border-gray-100">
                      <img src={post.cover} className="w-full h-24 object-cover" alt={post.title} />
                      <div className="p-3"><p className="text-xs font-bold text-gray-800 leading-relaxed">{post.title}</p></div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                <div className="flex items-center justify-between"><h3 className="font-black text-gray-900">最近活跃群组</h3><button onClick={() => navigate('group')} className="text-orange-500 text-[11px] font-bold">进入</button></div>
                <div className="mt-3 p-3 rounded-2xl bg-gray-50 border border-gray-100">
                  <p className="text-sm font-black text-gray-900">{mainGroupData.name}</p>
                  <p className="text-xs text-gray-500 mt-1">{mainGroupData.schedule} · {mainGroupData.mode}</p>
                </div>
              </div>
            </div>
            <BottomNav navigate={navigate} active="profile" />
          </div>
        );
      };

      // 5. AITripPlanner 智能规划 (精简重制版)
      const ScreenAITripPlanner = ({ navigate }) => {
        return (
          <div className="relative w-full h-full bg-[#F3F4F6] flex flex-col font-sans overflow-hidden">
            <div className="bg-white px-5 pt-12 pb-4 shadow-sm z-20">
              <h1 className="text-2xl font-black text-gray-900 mb-1">AI 行程规划</h1>
              <p className="text-sm text-gray-500">只需几秒，为您定制专属旅游路线</p>
            </div>
            <div className="flex-1 overflow-y-auto p-5 pb-24 space-y-5">
              <div className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                 <label className="text-sm font-bold text-gray-900 block mb-3">我想去探索...</label>
                 <input type="text" placeholder="输入国家或城市 (如: 冰岛、京都)" className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm mb-4 outline-none focus:ring-2 ring-orange-500/50" />
                 <label className="text-sm font-bold text-gray-900 block mb-3">旅行天数</label>
                 <input type="number" placeholder="例如: 5 天" className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" />
              </div>
              <div className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                 <h3 className="text-sm font-bold text-gray-900 mb-3 flex items-center gap-2"><Wallet className="w-4 h-4 text-gray-400" /> 您的旅行预算</h3>
                 <div className="grid grid-cols-3 gap-3">
                   {[{ id: 'low', label: '穷游背包', icon: '🎒' }, { id: 'medium', label: '舒适体验', icon: '🧳' }, { id: 'high', label: '豪华度假', icon: '💎' }].map(b => (
                     <button key={b.id} className={`p-3 rounded-2xl border text-center transition-all ${b.id === 'medium' ? 'border-orange-500 bg-orange-50 text-orange-600' : 'border-gray-200 text-gray-500'}`}>
                       <div className="text-xl mb-1">{b.icon}</div><div className="text-xs font-bold">{b.label}</div>
                     </button>
                   ))}
                 </div>
              </div>
              <button onClick={() => alert('行程生成中... (演示版本)')} className="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-full py-4 font-bold flex items-center justify-center gap-2 shadow-lg shadow-orange-500/30 active:scale-95 transition-transform"><Sparkles className="w-5 h-5" /> 生成专属行程</button>
            </div>
            <BottomNav navigate={navigate} active="planner" />
          </div>
        );
      };

      // ================= 主应用 Router =================
      function App() {
        const [currentPage, setCurrentPage] = useState('onboarding');
        const [pageHistory, setPageHistory] = useState(['onboarding']);

        const navigate = (page) => {
          setCurrentPage(prev => {
            if (prev === page) return prev;
            setPageHistory(history => [...history, page]);
            return page;
          });
        };

        const goBack = () => {
          setPageHistory(history => {
            if (history.length <= 1) {
              setCurrentPage('home');
              return ['home'];
            }
            const nextHistory = history.slice(0, -1);
            setCurrentPage(nextHistory[nextHistory.length - 1]);
            return nextHistory;
          });
        };

        return (
          <div className="relative w-full h-screen bg-gray-900 overflow-hidden font-sans flex flex-col justify-center items-center">
            <style>{globalStyles}</style>

            {/* 统一唯一的手机壳模拟 */}
            <div className="relative w-full h-full sm:w-[375px] sm:h-[812px] sm:rounded-[3rem] sm:border-[8px] border-gray-800 bg-black overflow-hidden shadow-2xl flex flex-col">

              {currentPage === 'onboarding' && <ScreenOnboarding navigate={navigate} />}
              {currentPage === 'home' && <ScreenHomeFeed navigate={navigate} />}
              {currentPage === 'detail' && <ScreenPlaceDetail navigate={navigate} goBack={goBack} />}
              {currentPage === 'interest' && <ScreenInterestUsers navigate={navigate} goBack={goBack} />}
              {currentPage === 'social' && <ScreenSocial navigate={navigate} />}
              {currentPage === 'review' && <ScreenWriteReview navigate={navigate} goBack={goBack} />}
              {currentPage === 'group' && <ScreenGroup navigate={navigate} goBack={goBack} />}
              {currentPage === 'chat' && <ScreenChat navigate={navigate} goBack={goBack} />}
              {currentPage === 'planner' && <ScreenAITripPlanner navigate={navigate} />}
              {currentPage === 'profile' && <ScreenProfileGamification navigate={navigate} goBack={goBack} />}

            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
